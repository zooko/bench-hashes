[package]
name = "bench-hashes"
version = "0.2.0+eaf35142fef3c02e694943ba72d610dd05e23d79"
edition = "2021"
rust-version = "1.75"
build = "build.rs"

[dependencies]
# Rayon is not enabled, so BLAKE3 remains single-threaded.
blake3 = {
    version = "1",
    default-features = false,
    features = ["std"]
}

# Use RustCrypto's optimized native assembly implementations.
sha2 = {
    version = "0.10",
    features = ["asm", "asm-aarch64"]
}

sha3 = {
    version = "0.10",
    features = ["asm"]
}

# Machine metadata does not need sysinfo's multithread feature.
sysinfo = {
    version = "0.30",
    default-features = false
}

[build-dependencies]
# Used to fingerprint a dirty benchmark working tree.
blake3 = {
    version = "1",
    default-features = false,
    features = ["std"]
}

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
